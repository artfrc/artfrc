# Coloque este arquivo em: .github/workflows/snake.yml (no repositório artfrc/artfrc)
# Gera a animação da cobrinha a partir do seu gráfico de contribuições
# e publica os SVGs na branch "output", que o README usa.

name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # A action acima roda em Docker como root, então a pasta dist/ pertence ao root.
      # Copiamos os SVGs para uma pasta do runner antes de criar o commit.
      - name: Publicar na branch output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/snake-output"
          mkdir -p "$OUT"
          cp dist/*.svg "$OUT/"
          cd "$OUT"
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: atualiza cobrinha de contribuições"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
